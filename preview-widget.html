<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Widget Preview</title>
<style>
  body {
    background: #e8f0eb;
    height: 100vh;
    margin: 0;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 18px;
  }
</style>
</head>
<body>

  <p>← Click the button in the bottom-right corner</p>

<style>
  #kup-widget * { box-sizing: border-box; margin: 0; padding: 0; }
  #kup-widget {
    position: fixed;
    bottom: 34px;
    right: 24px;
    z-index: 9999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #kup-widget.kup-visible { opacity: 1; pointer-events: auto; }
  #kup-btn {
    width: 56px; height: 56px; border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
    margin-left: auto;
  }
  #kup-btn:hover { transform: scale(1.07); }
  #kup-btn svg { width: 52px; height: 52px; transition: opacity 0.2s; }
  #kup-btn .kup-icon-close { display: none; }
  #kup-widget.kup-open #kup-btn .kup-icon-chat { display: none; }
  #kup-widget.kup-open #kup-btn .kup-icon-close { display: block; }
  #kup-panel {
    display: none; flex-direction: column;
    width: 360px; height: 520px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    overflow: hidden; margin-bottom: 12px;
  }
  #kup-widget.kup-open #kup-panel { display: flex; }
  #kup-header {
    background: #2a7d4f; padding: 16px 18px;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #kup-header-dot { width: 9px; height: 9px; border-radius: 50%; background: #7ee8a2; flex-shrink: 0; }
  #kup-header-title { color: white; font-size: 15px; font-weight: 600; flex: 1; }
  #kup-header-sub { color: rgba(255,255,255,0.75); font-size: 11px; margin-top: 1px; }
  #kup-messages {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
  }
  .kup-msg {
    max-width: 82%; padding: 10px 13px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.5; word-break: break-word;
  }
  .kup-msg-bot { background: #f0f5f2; color: #1a1a1a; border-bottom-left-radius: 4px; align-self: flex-start; }
  .kup-msg-user { background: #2a7d4f; color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
  #kup-typing { display: none; align-self: flex-start; background: #f0f5f2; border-radius: 14px; border-bottom-left-radius: 4px; padding: 10px 14px; }
  #kup-typing span { display: inline-block; width: 7px; height: 7px; background: #2a7d4f; border-radius: 50%; margin: 0 2px; animation: kup-bounce 1.2s infinite; }
  #kup-typing span:nth-child(2) { animation-delay: 0.2s; }
  #kup-typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes kup-bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
  #kup-input-area {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-top: 1px solid #e8f0eb; flex-shrink: 0;
  }
  #kup-input {
    flex: 1; border: 1.5px solid #d0e8da; border-radius: 22px;
    padding: 9px 14px; font-size: 13.5px; outline: none;
    transition: border-color 0.2s; background: #fafafa; color: #1a1a1a;
  }
  #kup-input:focus { border-color: #2a7d4f; background: #fff; }
  #kup-input::placeholder { color: #aaa; }
  #kup-send {
    width: 38px; height: 38px; border-radius: 50%; background: #2a7d4f;
    border: none; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; transition: background 0.2s;
  }
  #kup-send:hover { background: #235f3c; }
  #kup-send svg { width: 18px; height: 18px; fill: white; }
</style>

<div id="kup-widget">
  <div id="kup-panel">
    <div id="kup-header">
      <div id="kup-header-dot"></div>
      <div>
        <div id="kup-header-title">Asistente Kuphuka</div>
        <div id="kup-header-sub">Responde al instante</div>
      </div>
    </div>
    <div id="kup-messages">
      <div id="kup-typing"><span></span><span></span><span></span></div>
    </div>
    <div id="kup-input-area">
      <input id="kup-input" type="text" placeholder="Escribe tu pregunta..." autocomplete="off" />
      <button id="kup-send" aria-label="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
  <button id="kup-btn" aria-label="Abrir asistente Kuphuka">
    <svg class="kup-icon-chat" viewBox="0 0 24 24" fill="none" stroke="#2a7d4f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l4.93-1.37C8.42 21.5 10.15 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/>
      <text x="12" y="17.5" text-anchor="middle" font-size="14" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="300" fill="#2a7d4f" stroke="none">?</text>
    </svg>
    <svg class="kup-icon-close" viewBox="0 0 24 24" fill="none" stroke="#2a7d4f" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<script>
(function () {
  var GREETING = '¡Hola! Soy el asistente de Kuphuka 👋 Puedo ayudarte con dudas sobre el producto, ingredientes, envíos o suscripciones. ¿Qué te gustaría saber?';
  var widget = document.getElementById('kup-widget');
  var btn = document.getElementById('kup-btn');
  var messagesEl = document.getElementById('kup-messages');
  var typingEl = document.getElementById('kup-typing');
  var inputEl = document.getElementById('kup-input');
  var sendBtn = document.getElementById('kup-send');
  var greeted = false;

  // Show immediately in preview (no 10s delay)
  widget.classList.add('kup-visible');

  function addMessage(text, role) {
    var div = document.createElement('div');
    div.className = 'kup-msg ' + (role === 'user' ? 'kup-msg-user' : 'kup-msg-bot');
    div.textContent = text;
    messagesEl.insertBefore(div, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(on) {
    typingEl.style.display = on ? 'flex' : 'none';
    sendBtn.disabled = on;
    if (on) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  btn.addEventListener('click', function () {
    widget.classList.toggle('kup-open');
    if (widget.classList.contains('kup-open') && !greeted) {
      greeted = true;
      setTimeout(function () {
        setLoading(true);
        setTimeout(function () {
          setLoading(false);
          addMessage(GREETING, 'bot');
          inputEl.focus();
        }, 800);
      }, 100);
    }
  });

  sendBtn.addEventListener('click', function () {
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    addMessage(text, 'user');
    setLoading(true);
    setTimeout(function () {
      setLoading(false);
      addMessage('(Preview mode — real responses load on the live site)', 'bot');
    }, 1000);
  });

  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { sendBtn.click(); }
  });
})();
</script>

</body>
</html>
