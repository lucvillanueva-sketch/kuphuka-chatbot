<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Icon Preview</title>
<style>
  body { background: #f0f5f2; display: flex; gap: 40px; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
  .option { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .option span { font-size: 13px; color: #555; text-align: center; }
  button {
    width: 56px; height: 56px; border-radius: 50%;
    background: transparent;
    border: 3px solid #2a7d4f;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(42,125,79,0.25);
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.07); }
  button svg { width: 30px; height: 30px; }
</style>
</head>
<body>

  <div class="option">
    <span>Current<br>(phone)</span>
    <button>
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a7d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 12 19.79 19.79 0 0 1 1.93 3.41 2 2 0 0 1 3.9 1.21h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 8.91a16 16 0 0 0 6 6l1.06-1.06a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </button>
  </div>

  <!-- Option B: round speech bubble with improved ? path -->
  <div class="option">
    <span>Option B<br>(improved)</span>
    <button>
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a7d4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l4.93-1.37C8.42 21.5 10.15 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/>
        <path d="M9.5 8.5 C9.5 6.5 14.5 6.5 14.5 8.5 C14.5 10.5 12 10.5 12 12.5 L12 14"/>
        <circle cx="12" cy="16.5" r="0.7" fill="#2a7d4f" stroke="none"/>
      </svg>
    </button>
  </div>

  <!-- Option C: round bubble, bigger typed ? -->
  <div class="option">
    <span>Option C<br>(bigger ?)</span>
    <button>
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a7d4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l4.93-1.37C8.42 21.5 10.15 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2z"/>
        <text x="12" y="17.5" text-anchor="middle" font-size="14" font-family="Georgia, serif" font-weight="bold" fill="#2a7d4f" stroke="none">?</text>
      </svg>
    </button>
  </div>

</body>
</html>
